<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAA-UBE | Sistema de Alertas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background-color: #f4f6f9; } /* Fondo ligeramente gris para contraste */
        
        /* Estilos para el Sidebar */
        #sidebar {
            min-width: 250px;
            max-width: 250px;
            min-height: 100vh;
            background: #2c3e50;
            color: #fff;
            transition: all 0.3s;
        }

        #sidebar .sidebar-header {
            padding: 20px;
            background: #1a252f;
        }

        #sidebar ul li a {
            padding: 15px 20px;
            display: block;
            color: #adb5bd;
            text-decoration: none;
        }

        #sidebar ul li a:hover {
            color: #fff;
            background: #34495e;
        }

        /* Mantendremos esta clase activa temporalmente para que visualices dónde estás */
        #sidebar ul li.active > a {
            color: #fff;
            background: #3498db;
        }

        .wrapper {
            display: flex;
            width: 100%;
        }

        #content {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header text-center">
                <h4 class="text-white mt-2">SAA-UBE</h4>
                <small class="text-muted">Sistema de Alertas</small>
            </div>

            <ul class="list-unstyled components mt-4">
    <li>
        <a href="{% url 'dashboard_home' %}"><i class="fas fa-home me-2"></i> Dashboard</a>
    </li>
    <li>
        <a href="{% url 'estudiantes' %}"><i class="fas fa-user-graduate me-2"></i> Estudiantes</a>
    </li>
    <li class="active">
        <a href="{% url 'alertas_ia' %}"><i class="fas fa-exclamation-triangle me-2"></i> Alertas de IA</a>
    </li>
    <li>
        <a href="{% url 'estadisticas' %}"><i class="fas fa-chart-line me-2"></i> Estadísticas</a>
    </li>
    <hr class="mx-3 border-light">
    <li>
        <a href="{% url 'configuracion' %}"><i class="fas fa-cog me-2"></i> Configuración</a>
    </li>
    <li>
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; padding: 15px 20px; width: 100%; text-align: left; color: #dc3545;">
                <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
            </button>
        </form>
    </li>
</ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
                <div class="container-fluid py-2">
                    <span class="navbar-text">
    Bienvenido, <strong>{% if user.is_authenticated %}{{ user.username|upper }}{% else %}Invitado{% endif %}</strong>
</span>
                </div>
            </nav>

            <div class="p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
