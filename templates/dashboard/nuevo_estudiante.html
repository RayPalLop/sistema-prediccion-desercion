{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Registrar Estudiante</h2>
                <a href="{% url 'estudiantes' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Volver
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Datos del nuevo registro</h6>
                </div>
                <div class="card-body p-4">
                    
                    <form method="POST" action="{% url 'nuevo_estudiante' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Primer Nombre</label>
                            <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" required placeholder="Ej. Carlos">
                        </div>

                        <div class="mb-3">
                            <label for="apellido" class="form-label fw-bold">Primer Apellido</label>
                            <input type="text" class="form-control form-control-lg" id="apellido" name="apellido" required placeholder="Ej. Mendoza">
                        </div>

                        <div class="mb-4">
                            <label for="carrera" class="form-label fw-bold">Carrera Universitaria</label>
                            <select class="form-select form-select-lg" id="carrera" name="carrera" required>
                                <option value="" disabled selected>Seleccione una carrera...</option>
                                {% for carrera in carreras %}
                                    <option value="{{ carrera.id }}">{{ carrera.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i> Guardar Estudiante
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
